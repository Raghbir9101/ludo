# nginx reverse proxy for Ludo Party.
# Install as /etc/nginx/sites-available/ludo-party and symlink into sites-enabled.
# Replace ludo.example.com and the certificate paths with your own.

# Upgrade only when the client asks for it (WebSocket), otherwise keep-alive to the upstream.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      '';
}

# Sign-in endpoints are rate limited per client IP.
limit_req_zone $binary_remote_addr zone=ludo_auth:10m rate=20r/m;

upstream ludo_party {
    server 127.0.0.1:8080;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name ludo.example.com;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name ludo.example.com;

    ssl_certificate     /etc/letsencrypt/live/ludo.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ludo.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:ludo_ssl:10m;

    # If the site is behind Cloudflare, restore the real client IP for logs.
    # Keep this list current: https://www.cloudflare.com/ips/
    # set_real_ip_from 173.245.48.0/20;
    # set_real_ip_from 103.21.244.0/22;
    # ... (remaining Cloudflare ranges)
    # real_ip_header CF-Connecting-IP;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;
    # img-src allows Google and Facebook profile photos.
    add_header Content-Security-Policy "default-src 'self'; connect-src 'self' wss: ws:; img-src 'self' data: https://*.googleusercontent.com https://*.fbcdn.net https://*.fbsbx.com; style-src 'self' 'unsafe-inline'; font-src 'self'; script-src 'self'; manifest-src 'self'; worker-src 'self'; frame-ancestors 'none'" always;

    gzip on;
    gzip_vary on;
    gzip_min_length 512;
    gzip_types text/css text/plain application/javascript text/javascript application/json application/manifest+json image/svg+xml;

    client_max_body_size 16k;

    # WebSocket endpoint: long timeouts because games last a long time. The Node server
    # pings every 25 s, which also keeps Cloudflare's 100 s idle timeout from firing.
    location = /ws {
        proxy_pass http://ludo_party;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header Origin $http_origin;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    location = /healthz {
        proxy_pass http://ludo_party;
        allow 127.0.0.1;
        allow ::1;
        deny all;
    }

    location /auth/ {
        limit_req zone=ludo_auth burst=20 nodelay;
        proxy_pass http://ludo_party;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Profile photo uploads (the browser shrinks them to 256x256 first; Node caps at 256 KB).
    location = /api/me/photo {
        client_max_body_size 300k;
        proxy_pass http://ludo_party;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # App, static files and /r/CODE share links. Node sets Cache-Control (no-cache for
    # app code so updates are picked up, 7 days for fonts and icons).
    location / {
        proxy_pass http://ludo_party;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
