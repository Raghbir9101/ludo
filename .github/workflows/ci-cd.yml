name: CI/CD

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm test

  deploy:
    name: Deploy to VPS
    needs: test
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    env:
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_USER: ${{ secrets.SSH_USER }}
      SSH_PORT: ${{ secrets.SSH_PORT }}
      SSH_PASSWORD: ${{ secrets.SSH_PASSWORD }}
      SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
      APP_DIR: ${{ vars.APP_DIR }}
    steps:
      - uses: actions/checkout@v4

      - name: Check deploy secrets
        id: cfg
        run: |
          if [ -z "$SSH_HOST" ] || [ -z "$SSH_USER" ] || [ -z "$SSH_PASSWORD" ]; then
            echo "::warning::Deploy skipped: set SSH_HOST, SSH_USER and SSH_PASSWORD in the 'production' environment secrets."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up SSH
        if: steps.cfg.outputs.ready == 'true'
        run: |
          install -m 700 -d ~/.ssh
          if [ -n "$SSH_KNOWN_HOSTS" ]; then
            printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          else
            ssh-keyscan -p "${SSH_PORT:-22}" -H "$SSH_HOST" > ~/.ssh/known_hosts 2>/dev/null
          fi
          # ssh asks this helper for the password; it reads the secret from the environment,
          # so the password itself is never written to disk.
          cat > "$RUNNER_TEMP/askpass" <<'EOF'
          #!/bin/sh
          printf '%s\n' "$SSH_PASSWORD"
          EOF
          chmod 700 "$RUNNER_TEMP/askpass"

      - name: Deploy
        if: steps.cfg.outputs.ready == 'true'
        env:
          SSH_ASKPASS: ${{ runner.temp }}/askpass
          SSH_ASKPASS_REQUIRE: force
        run: |
          ssh -p "${SSH_PORT:-22}" -o ConnectTimeout=20 -o PubkeyAuthentication=no \
            -o PreferredAuthentications=password,keyboard-interactive -o NumberOfPasswordPrompts=1 \
            "$SSH_USER@$SSH_HOST" \
            "SHA='$GITHUB_SHA' APP_DIR='${APP_DIR:-/var/www/ludo}' bash -s" < scripts/deploy.sh

      - name: Clean up
        if: always()
        run: rm -f "$RUNNER_TEMP/askpass"
